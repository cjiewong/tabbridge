name: Bug report
description: Report a reproducible bridge, extension, CLI or MCP problem
body:
  - type: markdown
    attributes:
      value: Please remove credentials, cookies, private page contents, screenshots and personal paths before posting.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Chrome, Node and TabBridge versions; CLI or MCP client.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer a public page or a minimal local fixture.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include the error code and sanitized diagnostic output.
    validations:
      required: true
